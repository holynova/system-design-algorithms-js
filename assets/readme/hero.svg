<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">系统设计算法 JS — Alex Xu《系统设计面试》28 章经典算法原生 JS 实现</title>
  <desc id="desc">深蓝蓝图底标题：系统设计算法，副标题 28 章经典算法，原生 JS 一把梭；右侧是一致性哈希环示意图与 Snowflake 64 位比特布局条。</desc>

  <rect width="1200" height="360" rx="26" fill="#0b1220"/>

  <g id="blueprint-grid" stroke="#16233d" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/>
    <path d="M60 0 V360 M120 0 V360 M180 0 V360 M240 0 V360 M300 0 V360 M360 0 V360 M420 0 V360 M480 0 V360 M540 0 V360 M600 0 V360 M660 0 V360 M720 0 V360 M780 0 V360 M840 0 V360 M900 0 V360 M960 0 V360 M1020 0 V360 M1080 0 V360 M1140 0 V360"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#7aa2e8">ALEX XU《系统设计面试》· SYSTEM DESIGN INTERVIEW</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f5f7fa">系统设计算法</text>
    <text x="56" y="168" font-size="23" fill="#e8ecf4">SYSTEM DESIGN ALGORITHMS IN JS</text>
    <text x="56" y="204" font-size="19" fill="#aab6cc">28 章经典算法与数据结构，原生 JS 实现，零依赖。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="108" height="36" rx="18" fill="#131f36" stroke="#2a3f66" stroke-width="1.5"/><text x="110" y="262">28 章</text></g>
      <g><rect x="176" y="238" width="126" height="36" rx="18" fill="#131f36" stroke="#2a3f66" stroke-width="1.5"/><text x="239" y="262">49 个算法</text></g>
      <g><rect x="314" y="238" width="150" height="36" rx="18" fill="#131f36" stroke="#2a3f66" stroke-width="1.5"/><text x="389" y="262">58 测试全过</text></g>
      <g><rect x="476" y="238" width="108" height="36" rx="18" fill="#131f36" stroke="#2a3f66" stroke-width="1.5"/><text x="530" y="262">零依赖</text></g>
    </g>
  </g>

  <g id="diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="700" y="40" font-size="18" fill="#7aa2e8">一致性哈希环 · 虚拟节点均衡负载</text>
    <g id="hash-ring">
      <circle cx="800" cy="150" r="78" fill="none" stroke="#2a3f66" stroke-width="2"/>
      <circle cx="800" cy="150" r="52" fill="none" stroke="#1c2c4a" stroke-width="1"/>
      <g id="nodes">
        <circle cx="800" cy="72" r="10" fill="#38bdf8"/>
        <circle cx="869" cy="120" r="10" fill="#f5c518"/>
        <circle cx="845" cy="200" r="10" fill="#38bdf8"/>
        <circle cx="755" cy="200" r="10" fill="#f5c518"/>
        <circle cx="731" cy="120" r="10" fill="#38bdf8"/>
      </g>
      <g id="keys" fill="#e8ecf4">
        <circle cx="838" cy="92" r="4"/>
        <circle cx="862" cy="168" r="4"/>
        <circle cx="800" cy="214" r="4"/>
        <circle cx="738" cy="168" r="4"/>
        <circle cx="762" cy="92" r="4"/>
      </g>
      <path d="M838 92 A78 78 0 0 1 869 120" fill="none" stroke="#f5c518" stroke-width="2" stroke-dasharray="4 3"/>
      <text x="800" y="146" font-size="19" fill="#e8ecf4" text-anchor="middle">顺时针</text>
      <text x="800" y="170" font-size="19" fill="#e8ecf4" text-anchor="middle">找后继</text>
    </g>
    <g id="snowflake">
      <text x="920" y="100" font-size="18" fill="#7aa2e8">Snowflake 64 位</text>
      <g id="bits" font-size="16" text-anchor="middle">
        <g><rect x="920" y="112" width="26" height="30" fill="#1c2c4a" stroke="#2a3f66"/><text x="933" y="133" fill="#e8ecf4">1</text></g>
        <g><rect x="946" y="112" width="110" height="30" fill="#38bdf8" stroke="#2a3f66"/><text x="1001" y="133" fill="#0b1220">41 时间戳</text></g>
        <g><rect x="1056" y="112" width="52" height="30" fill="#f5c518" stroke="#2a3f66"/><text x="1082" y="133" fill="#0b1220">5+5</text></g>
        <g><rect x="1108" y="112" width="42" height="30" fill="#7aa2e8" stroke="#2a3f66"/><text x="1129" y="133" fill="#0b1220">12</text></g>
      </g>
      <text x="920" y="168" font-size="16" fill="#aab6cc">符号位 · 毫秒 · 机房/机器 · 序列号</text>
      <g id="lru-chain">
        <text x="920" y="210" font-size="18" fill="#7aa2e8">LRU · 哈希表 + 双向链表</text>
        <g font-size="17" text-anchor="middle">
          <g><rect x="920" y="222" width="56" height="30" rx="6" fill="#131f36" stroke="#2a3f66" stroke-width="1.5"/><text x="948" y="243" fill="#e8ecf4">MRU</text></g>
          <text x="984" y="243" fill="#7aa2e8">↔</text>
          <g><rect x="1000" y="222" width="56" height="30" rx="6" fill="#131f36" stroke="#2a3f66" stroke-width="1.5"/><text x="1028" y="243" fill="#e8ecf4">…</text></g>
          <text x="1064" y="243" fill="#7aa2e8">↔</text>
          <g><rect x="1080" y="222" width="56" height="30" rx="6" fill="#131f36" stroke="#f5c518" stroke-width="1.5"/><text x="1108" y="243" fill="#f5c518">LRU</text></g>
        </g>
        <text x="920" y="282" font-size="16" fill="#aab6cc">Get / Put 均为 O(1)，淘汰表尾</text>
      </g>
    </g>
    <text x="790" y="300" font-size="18" fill="#aab6cc" text-anchor="middle">虚拟节点 ×100 · 二分查找</text>
    <text x="800" y="330" font-size="18" fill="#aab6cc" text-anchor="middle">扩缩容只迁移相邻区间</text>
  </g>
</svg>
