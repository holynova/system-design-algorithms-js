<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">System Design Algorithms in JS - Architectural Blueprint</title>
  <desc id="desc">Visual blueprint of classic distributed system design algorithms implemented in native ES Modules, covering consistent hash rings, Snowflake 64-bit IDs, rate limiters, skip lists, and order books.</desc>

  <defs>
    <!-- Background Gradients & Grid -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="70%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="30%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="blueprintGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151e32"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="cyanTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" rx="16" fill="url(#blueprintGrid)"/>
  <rect width="1200" height="440" rx="16" fill="url(#cyanGlow)"/>
  <rect width="1200" height="440" rx="16" fill="url(#purpleGlow)"/>
  <rect x="1" y="1" width="1198" height="438" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- LEFT COLUMN: Identity & Core Value -->
  <g id="hero-left" transform="translate(60, 48)">
    <!-- Eyebrow Badge -->
    <g id="eyebrow">
      <rect x="0" y="0" width="370" height="28" rx="14" fill="#0f2847" stroke="#0284c7" stroke-width="1"/>
      <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
      <text x="26" y="19" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, monospace" font-size="12" font-weight="600" fill="#7dd3fc" letter-spacing="1">ALEX XU · SYSTEM DESIGN INTERVIEW</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      System Design Algorithms
    </text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="url(#cyanTextGrad)">
      系统设计经典算法全景图解 (JavaScript)
    </text>

    <!-- Description Paragraph -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="15" fill="#94a3b8" line-height="24">
      <tspan x="0" dy="0">严格对标《系统设计面试：内幕指南》第一卷与第二卷全部 28 个章节。</tspan>
      <tspan x="0" dy="24">采用现代 Node.js 原生 ES Modules 纯净实现，自包含、强类型语义，</tspan>
      <tspan x="0" dy="24">零第三方 npm 依赖，配套 58 项自动化测试与交互式可视化 Web 实验室。</tspan>
    </text>

    <!-- Feature Metric Pills -->
    <g id="feature-pills" transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="48" rx="8" fill="#131e33" stroke="#253554" stroke-width="1"/>
        <text x="14" y="22" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#38bdf8">28 章节</text>
        <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">VOL 1 &amp; VOL 2</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(122, 0)">
        <rect width="118" height="48" rx="8" fill="#131e33" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="22" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#34d399">58/58</text>
        <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">PASSING TESTS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(250, 0)">
        <rect width="112" height="48" rx="8" fill="#131e33" stroke="#253554" stroke-width="1"/>
        <text x="14" y="22" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#fbbf24">0 依赖</text>
        <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">ZERO NPM DEPS</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(372, 0)">
        <rect width="128" height="48" rx="8" fill="#131e33" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4"/>
        <text x="14" y="22" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#a5b4fc">WEB LAB</text>
        <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">INTERACTIVE</text>
      </g>
    </g>

    <!-- Terminal Command Hint -->
    <g id="command-hint" transform="translate(0, 310)">
      <rect width="500" height="36" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#38bdf8">$</text>
      <text x="30" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#e2e8f0">npm test &amp;&amp; npm run web</text>
      <text x="360" y="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#64748b"># :3000</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Distributed Systems Architectural Blueprint -->
  <g id="hero-right" transform="translate(590, 36)">
    <!-- CARD 1: Consistent Hash Ring (Top-Left) -->
    <g id="card-hash-ring" transform="translate(0, 0)">
      <rect width="275" height="175" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
      <!-- Header -->
      <circle cx="16" cy="18" r="4" fill="#38bdf8"/>
      <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Ch05 · 一致性哈希环</text>
      <text x="210" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8">O(log VN)</text>

      <!-- Consistent Hash Graphic -->
      <g transform="translate(137, 102)">
        <!-- Hash Circle -->
        <circle cx="0" cy="0" r="48" fill="none" stroke="#253554" stroke-width="3" stroke-dasharray="4 2"/>
        <circle cx="0" cy="0" r="48" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3"/>
        
        <!-- Virtual Nodes -->
        <!-- Node A -->
        <circle cx="0" cy="-48" r="5" fill="#38bdf8"/>
        <text x="8" y="-45" font-family="ui-monospace, monospace" font-size="9" fill="#7dd3fc">Node_A#1</text>
        
        <!-- Node B -->
        <circle cx="41" cy="24" r="5" fill="#34d399"/>
        <text x="48" y="27" font-family="ui-monospace, monospace" font-size="9" fill="#6ee7b7">Node_B#1</text>

        <!-- Node C -->
        <circle cx="-41" cy="24" r="5" fill="#fbbf24"/>
        <text x="-76" y="27" font-family="ui-monospace, monospace" font-size="9" fill="#fde68a">Node_C#1</text>

        <!-- Key Mapping Arrow -->
        <circle cx="34" cy="-34" r="3.5" fill="#f43f5e"/>
        <path d="M 28 -28 A 48 48 0 0 1 38 18" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="2 2"/>
        <polygon points="37,20 42,16 35,13" fill="#f43f5e"/>
        <text x="5" y="-12" font-family="ui-monospace, monospace" font-size="9" fill="#fda4af">hash(k1) → B</text>

        <text x="0" y="5" font-family="ui-monospace, monospace" font-size="9" fill="#64748b" text-anchor="middle">2^32-1</text>
      </g>
      <text x="16" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">虚拟节点均衡负载 · 最小化数据迁移</text>
    </g>

    <!-- CARD 2: Snowflake 64-bit ID Layout (Top-Right) -->
    <g id="card-snowflake" transform="translate(290, 0)">
      <rect width="275" height="175" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#818cf8"/>
      <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Ch07 · 64-bit 雪花 ID</text>
      <text x="218" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#a5b4fc">O(1)</text>

      <!-- Snowflake Bitfield Bar Graphic -->
      <g transform="translate(14, 46)">
        <!-- Bitfield segmented bar -->
        <rect x="0" y="0" width="16" height="26" rx="2" fill="#334155"/>
        <text x="8" y="17" font-family="ui-monospace, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0</text>

        <rect x="18" y="0" width="105" height="26" rx="2" fill="#1e3a5f"/>
        <text x="70" y="17" font-family="ui-monospace, monospace" font-size="10" fill="#38bdf8" text-anchor="middle">41b Timestamp</text>

        <rect x="125" y="0" width="36" height="26" rx="2" fill="#2d2254"/>
        <text x="143" y="17" font-family="ui-monospace, monospace" font-size="9" fill="#c084fc" text-anchor="middle">5b DC</text>

        <rect x="163" y="0" width="36" height="26" rx="2" fill="#3b2d54"/>
        <text x="181" y="17" font-family="ui-monospace, monospace" font-size="9" fill="#e879f9" text-anchor="middle">5b Wk</text>

        <rect x="201" y="0" width="45" height="26" rx="2" fill="#164e63"/>
        <text x="223" y="17" font-family="ui-monospace, monospace" font-size="9" fill="#2dd4bf" text-anchor="middle">12b Seq</text>
      </g>

      <!-- Decoded Inspector Console -->
      <g transform="translate(14, 82)">
        <rect width="247" height="42" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
        <text x="10" y="17" font-family="ui-monospace, monospace" font-size="10" fill="#64748b">GEN ID:</text>
        <text x="60" y="17" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34d399">184918204910284801n</text>
        <text x="10" y="32" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8">ts: +14829ms | dc: 01 | wk: 03 | seq: 0001</text>
      </g>

      <g transform="translate(14, 134)">
        <rect width="247" height="24" rx="4" fill="#1e1b4b" stroke="#4338ca" stroke-width="0.8"/>
        <text x="10" y="16" font-family="ui-monospace, monospace" font-size="9.5" fill="#a5b4fc">✔ 时钟回拨防御 &amp; 4096 容量/毫秒</text>
      </g>
    </g>

    <!-- CARD 3: Token Bucket Rate Limiter (Bottom-Left) -->
    <g id="card-rate-limiter" transform="translate(0, 190)">
      <rect width="275" height="175" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#10b981"/>
      <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Ch04 · 令牌桶/漏桶限流</text>
      <text x="212" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#34d399">O(1)</text>

      <!-- Flowchart / Bucket Schematic -->
      <g transform="translate(20, 42)">
        <!-- Bucket Outline -->
        <path d="M 40 10 L 48 70 L 92 70 L 100 10" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
        <!-- Water / Token Fill Level -->
        <path d="M 46 50 L 48 70 L 92 70 L 94 50 Z" fill="#0284c7" fill-opacity="0.35"/>
        <text x="70" y="64" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Tokens</text>

        <!-- Refill Pipe -->
        <path d="M 70 -5 L 70 8" fill="none" stroke="#34d399" stroke-width="2"/>
        <polygon points="70,12 66,6 74,6" fill="#34d399"/>
        <text x="70" y="-8" font-family="ui-monospace, monospace" font-size="8.5" fill="#6ee7b7" text-anchor="middle">+r/sec</text>

        <!-- Traffic Input & Decision -->
        <g transform="translate(130, 10)">
          <!-- Request Arrow -->
          <text x="0" y="10" font-family="ui-monospace, monospace" font-size="9.5" fill="#94a3b8">Req In</text>
          <path d="M 38 7 L 65 7" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
          <polygon points="67,7 62,4 62,10" fill="#94a3b8"/>

          <!-- Allow Box -->
          <rect x="70" y="-4" width="44" height="18" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
          <text x="92" y="9" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">200 OK</text>

          <!-- Reject Box -->
          <rect x="70" y="20" width="44" height="18" rx="3" fill="#4c0519" stroke="#f43f5e" stroke-width="1"/>
          <text x="92" y="33" font-family="ui-monospace, monospace" font-size="9" font-weight="700" fill="#fb7185" text-anchor="middle">429 DROP</text>
        </g>

        <!-- Rate limiter modes pill -->
        <g transform="translate(0, 85)">
          <rect width="235" height="32" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
          <text x="10" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">MODES:</text>
          <text x="56" y="14" font-family="ui-monospace, monospace" font-size="9" fill="#38bdf8">TokenBucket · LeakyBucket</text>
          <text x="10" y="26" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">SLIDING:</text>
          <text x="56" y="26" font-family="ui-monospace, monospace" font-size="9" fill="#a5b4fc">SlidingLog · SlidingCounter</text>
        </g>
      </g>
    </g>

    <!-- CARD 4: Skip List & Order Book (Bottom-Right) -->
    <g id="card-skip-list" transform="translate(290, 190)">
      <rect width="275" height="175" rx="10" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2"/>
      <circle cx="16" cy="18" r="4" fill="#f59e0b"/>
      <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">V2·Ch10 跳表 &amp; Ch13 撮合引擎</text>
      <text x="218" y="21" font-family="ui-monospace, monospace" font-size="10" fill="#fbbf24">O(log N)</text>

      <!-- Skip List Levels Graphic -->
      <g transform="translate(14, 42)">
        <!-- Level 2 -->
        <text x="0" y="10" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">L2</text>
        <rect x="22" y="2" width="22" height="11" rx="2" fill="#1e3a5f"/>
        <path d="M 44 7 L 140 7" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
        <rect x="140" y="2" width="22" height="11" rx="2" fill="#1e3a5f"/>
        <path d="M 162 7 L 220 7" fill="none" stroke="#38bdf8" stroke-width="1.2"/>
        <rect x="220" y="2" width="22" height="11" rx="2" fill="#1e3a5f"/>

        <!-- Level 1 -->
        <text x="0" y="26" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">L1</text>
        <rect x="22" y="18" width="22" height="11" rx="2" fill="#1e293b"/>
        <path d="M 44 23 L 80 23" fill="none" stroke="#64748b" stroke-width="1.2"/>
        <rect x="80" y="18" width="22" height="11" rx="2" fill="#1e293b"/>
        <path d="M 102 23 L 140 23" fill="none" stroke="#64748b" stroke-width="1.2"/>
        <rect x="140" y="18" width="22" height="11" rx="2" fill="#1e293b"/>
        <path d="M 162 23 L 220 23" fill="none" stroke="#64748b" stroke-width="1.2"/>
        <rect x="220" y="18" width="22" height="11" rx="2" fill="#1e293b"/>

        <!-- Level 0 -->
        <text x="0" y="42" font-family="ui-monospace, monospace" font-size="9" fill="#64748b">L0</text>
        <rect x="22" y="34" width="22" height="11" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="33" y="43" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">10</text>
        <rect x="52" y="34" width="22" height="11" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="63" y="43" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">25</text>
        <rect x="82" y="34" width="22" height="11" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="93" y="43" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">38</text>
        <rect x="112" y="34" width="22" height="11" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="123" y="43" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">50</text>
        <rect x="142" y="34" width="22" height="11" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="153" y="43" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">72</text>
        <rect x="172" y="34" width="22" height="11" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="183" y="43" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">89</text>
        <rect x="202" y="34" width="22" height="11" rx="2" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="213" y="43" font-family="ui-monospace, monospace" font-size="8" fill="#94a3b8" text-anchor="middle">99</text>
      </g>

      <!-- Limit Order Book Depth Bar -->
      <g transform="translate(14, 102)">
        <rect width="247" height="20" rx="3" fill="#090d16" stroke="#1e293b" stroke-width="0.8"/>
        <rect x="2" y="2" width="118" height="16" rx="2" fill="#064e3b" fill-opacity="0.4"/>
        <text x="10" y="14" font-family="ui-monospace, monospace" font-size="8.5" fill="#34d399">BIDS: $150.20 (450)</text>
        <rect x="126" y="2" width="119" height="16" rx="2" fill="#4c0519" fill-opacity="0.4"/>
        <text x="134" y="14" font-family="ui-monospace, monospace" font-size="8.5" fill="#f43f5e">ASKS: $150.25 (320)</text>
      </g>

      <text x="14" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8">Redis ZSET 底层原理 · FIFO 价格时间优先撮合</text>
    </g>
  </g>
</svg>
